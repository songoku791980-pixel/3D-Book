name: Build and deploy textbook
on:
  push:
    branches: [main]
    paths:
      - 'textbook-project.zip'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: textbook-src/package-lock.json
      - name: Extract project
        run: |
          unzip -q textbook-project.zip
          test -f textbook-src/package.json
          sed -i "s|export default defineConfig({|export default defineConfig({\n  base: '/3D-Book/',|" textbook-src/vite.config.ts
      - name: Install dependencies
        working-directory: textbook-src
        run: npm ci
      - name: Build
        working-directory: textbook-src
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: textbook-src/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
